name: Build and deploy Python app to Azure Web App - collabrix-model

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

```
permissions:
  contents: read

defaults:
  run:
    working-directory: ai_backend

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Create virtual environment and install dependencies
    run: |
      python -m venv antenv
      source antenv/bin/activate

      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Verify FastAPI app structure
    run: |
      ls
      ls app

  - name: Upload deployment artifact
    uses: actions/upload-artifact@v4
    with:
      name: python-app
      path: ai_backend
```

deploy:
runs-on: ubuntu-latest
needs: build

```
permissions:
  id-token: write
  contents: read

steps:
  - name: Download artifact
    uses: actions/download-artifact@v4
    with:
      name: python-app
      path: .

  - name: Login to Azure
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE611C645993428BBAD523B480737D12 }}
      tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E4325389CF61478C8A15D6E1DE4E21D5 }}
      subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2E28FC509ED4B63BB9EA179A7E973EB }}

  - name: Deploy to Azure Web App
    id: deploy-to-webapp
    uses: azure/webapps-deploy@v3
    with:
      app-name: 'collabrix-model'
      slot-name: 'Production'
      package: .
```
